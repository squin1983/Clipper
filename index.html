<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0b0b0f"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Clipper"
  >

  <meta
    name="description"
    content="Clipper — creator inspiration and remix workflow."
  >

  <title>Clipper</title>

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="icon"
    href="icon.svg"
    type="image/svg+xml"
  >

  <link
    rel="stylesheet"
    href="styles.css?v=2"
  >
</head>

<body>

  <div id="app"></div>

  <script src="app.js?v=2"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js?v=2")
          .catch(function (error) {
            console.error(
              "Service worker registration failed:",
              error
            );
          });
      });
    }
  </script>

</body>
</html>
